<!DOCTYPE html><html lang="pt-br" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Convênios</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><nav th:replace="~{fragments :: nav}"></nav><main class="container"><div class="page-head"><div><h1>Convênios</h1><p>Operadoras aceitas pela clínica</p></div><a sec:authorize="hasAuthority('CONVENIO_GERENCIAR')" class="btn primary" th:href="@{/convenios/novo}">Novo convênio</a></div><div class="alert success" th:if="${sucesso}" th:text="${sucesso}"></div><section class="panel"><table><thead><tr><th>Operadora</th><th>Registro ANS</th><th>Contato</th><th>Status</th><th></th></tr></thead><tbody><tr th:each="c:${convenios}"><td><strong th:text="${c.nome}"></strong></td><td th:text="${c.registroAns?:'-'}"></td><td><span th:text="${c.telefone?:'-'}"></span><br><small th:text="${c.email?:''}"></small></td><td><span class="badge" th:text="${c.ativo?'ATIVO':'INATIVO'}"></span></td><td><a sec:authorize="hasAuthority('CONVENIO_GERENCIAR')" class="btn secondary" th:href="@{/convenios/{id}/editar(id=${c.id})}">Editar</a></td></tr></tbody></table></section></main></body></html>

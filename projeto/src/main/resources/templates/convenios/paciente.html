<!DOCTYPE html><html lang="pt-br" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Convênios do paciente</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><nav th:replace="~{fragments :: nav}"></nav><main class="container"><div class="page-head"><div><h1>Convênios do paciente</h1><p th:text="${paciente.nome+' • CPF '+paciente.cpf}"></p></div><a class="btn secondary" th:href="@{/pacientes}">Voltar</a></div><div class="alert success" th:if="${sucesso}" th:text="${sucesso}"></div><section class="grid2"><form class="panel" th:action="@{/pacientes/{id}/convenios(id=${paciente.id})}" method="post"><h2>Adicionar convênio/plano</h2><label>Operadora<select name="convenioId" required><option th:each="c:${convenios}" th:value="${c.id}" th:text="${c.nome}"></option></select></label><label>Plano<input name="plano" required placeholder="Ex.: Executivo, Enfermaria..."></label><label>Número da carteirinha<input name="numeroCarteirinha" required></label><label>Titular<input name="titular" th:value="${paciente.nome}"></label><label>Validade<input type="date" name="validade"></label><button class="primary">Vincular convênio</button></form><section class="panel"><h2>Planos cadastrados</h2><div class="coverage-item" th:each="v:${vinculos}"><div><strong th:text="${v.convenio.nome}"></strong><span th:text="${v.plano+' • '+v.numeroCarteirinha}"></span><small th:text="${'Titular: '+(v.titular?:'-')+' • Validade: '+(v.validade?:'sem validade')}"></small></div><div><span class="badge" th:text="${v.valido?'VÁLIDO':'INATIVO/VENCIDO'}"></span><form th:action="@{/pacientes/{p}/convenios/{id}/alternar(p=${paciente.id},id=${v.id})}" method="post"><button class="btn secondary" th:text="${v.ativo?'Desativar':'Ativar'}"></button></form></div></div><p th:if="${#lists.isEmpty(vinculos)}">Nenhum convênio cadastrado. O paciente pode ser atendido como particular.</p></section></section></main></body></html>

<!DOCTYPE html><html lang="pt-br" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Atendimento</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><nav th:replace="~{fragments :: nav}"></nav><main class="container"><div class="page-head"><div><h1 th:text="${'Atendimento #'+atendimento.id}"></h1><p th:text="${atendimento.paciente.nome+' • '+atendimento.profissional.nome}"></p></div><span class="badge big" th:text="${atendimento.classificacao}"></span></div><section class="cards"><div class="card"><span>Pressão</span><strong th:text="${atendimento.pressaoArterial?:'-'}"></strong></div><div class="card"><span>Temperatura</span><strong th:text="${atendimento.temperatura?:'-'}"></strong></div><div class="card"><span>FC</span><strong th:text="${atendimento.frequenciaCardiaca?:'-'}"></strong></div><div class="card"><span>Saturação</span><strong th:text="${atendimento.saturacao?:'-'}"></strong></div></section><section class="grid2"><div class="panel"><h2>Triagem inteligente</h2><p><b>Score:</b> <span th:text="${triagem.score}"></span></p><p th:text="${triagem.recomendacao}"></p><ul><li th:each="a:${triagem.alertas}" th:text="${a}"></li></ul><p th:if="${#lists.isEmpty(triagem.alertas)}">Sem alertas automáticos.</p></div><div class="panel"><h2>Queixa / Anamnese</h2><p th:text="${atendimento.queixaPrincipal}"></p><p th:text="${atendimento.anamnese}"></p></div></section><section class="grid2"><form sec:authorize="hasAuthority('PRESCRICAO_GERENCIAR')" class="panel" th:action="@{/atendimentos/{id}/prescricoes(id=${atendimento.id})}" method="post"><h2>Nova prescrição</h2><label>Medicamento<input name="medicamento" required></label><label>Dosagem<input name="dosagem" required></label><label>Frequência<input name="frequencia" required></label><label>Duração<input name="duracao"></label><label>Orientações<textarea name="orientacoes"></textarea></label><button class="primary">Adicionar</button></form><form sec:authorize="hasAuthority('EXAME_GERENCIAR')" class="panel" th:action="@{/atendimentos/{id}/exames(id=${atendimento.id})}" method="post"><h2>Solicitar exame</h2><label>Exame<input name="nome" required></label><label>Observações<textarea name="observacoes"></textarea></label><button class="primary">Solicitar</button></form></section><section class="grid2"><div class="panel"><h2>Prescrições</h2><div class="item" th:each="p:${prescricoes}"><b th:text="${p.medicamento}"></b><span th:text="${p.dosagem+' • '+p.frequencia}"></span></div></div><div class="panel"><h2>Exames</h2><div class="item" th:each="e:${exames}"><b th:text="${e.nome}"></b><span th:text="${e.status}"></span></div></div></section><form sec:authorize="hasAuthority('ATENDIMENTO_EDITAR')" class="panel" th:if="${atendimento.fim==null}" th:action="@{/atendimentos/{id}/finalizar(id=${atendimento.id})}" method="post"><h2>Finalizar atendimento</h2><label>Diagnóstico<textarea name="diagnostico" required></textarea></label><label>Conduta<textarea name="conduta" required></textarea></label><button class="primary">Finalizar atendimento</button></form><section class="panel" th:if="${atendimento.fim!=null}"><h2>Atendimento finalizado</h2><p><b>Diagnóstico:</b> <span th:text="${atendimento.diagnostico}"></span></p><p><b>Conduta:</b> <span th:text="${atendimento.conduta}"></span></p></section></main></body></html>
